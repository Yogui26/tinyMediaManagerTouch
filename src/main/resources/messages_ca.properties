wizard.datasource.hint=Indicar les carpetes on el tinyMediaManager ha de buscar els arxius de vídeo.
wizard.disclaimer=Avís legal
wizard.disclaimer.long=El tinyMediaManager és un gestor multimèdia que t'ajuda a organitzar la biblioteca multimèdia proporcionant un accés fàcil a serveis de tercers com «The Movie Database (TMDB)», «TheTVDB.com», «Fanart.tv», «Trakt.tv» i altres.\n\nEl tinyMediaManager actua únicament com a eina de gestió i interfície tècnica. Tingues en compte que l'aplicació no proporciona ni allotja cap metadada, imatge ni informació de pel·lícules. El programari funciona exclusivament com a consumidor de diverses bases de dades i serveis en línia.\n\nTota la informació obtinguda amb aquesta eina prové de proveïdors externs. El proveïdor de cada dada és clarament identificable dins de l'aplicació en tot moment. En obtenir aquestes dades, acceptes que s'apliquen les condicions d'ús i les polítiques de llicència del proveïdor corresponent. El tinyMediaManager no assumeix cap responsabilitat per l'exactitud, la legalitat o la disponibilitat d'aquest contingut extern. L'ús d'aquestes interfícies és sota la teva responsabilitat i està subjecte a les directrius del proveïdor.\n\nEl tinyMediaManager es desenvolupa sota la llicència Apache v2 (https://www.apache.org/licenses/LICENSE-2.0) i utilitza altres components de codi obert. En aquesta versió del tinyMediaManager s'utilitza codi assistit per IA de manera selectiva: els nostres desenvolupadors han revisat i verificat personalment cada secció per a garantir els nostres estàndards de qualitat.\nAquesta eina la desenvolupen i la proven diversos usuaris, però encara pot contenir errors que poden esborrar o destruir la teva biblioteca multimèdia. Assegurar-te de fer sempre còpies de seguretat de les teves dades. No ens fem responsables de cap pèrdua de dades causada per aquesta eina!\n\nEL PROGRAMARI ES PROPORCIONA «TAL COM ÉS», SENSE CAP MENA DE GARANTIA, EXPRESSA O IMPLÍCITA, INCLOSES, PERÒ SENSE LIMITAR-S'HI, LES GARANTIES DE COMERCIABILITAT, D'IDONEÏTAT PER A UN PROPÒSIT DETERMINAT I DE NO INFRACCIÓ. EN CAP CAS ELS AUTORS O ELS TITULARS DELS DRETS D'AUTOR NO SERAN RESPONSABLES DE CAP RECLAMACIÓ, DANY O ALTRA RESPONSABILITAT, JA SIGUI EN UNA ACCIÓ CONTRACTUAL, EXTRACONTRACTUAL O D'ALTRA MENA, DERIVADA DEL PROGRAMARI, DEL SEU ÚS O D'ALTRES OPERACIONS AMB EL PROGRAMARI, O RELACIONADA AMB AQUESTS.
