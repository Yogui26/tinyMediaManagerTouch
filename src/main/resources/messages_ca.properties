scraper.tmdb.hint=<html><h3>The Movie Database (TMDB)</h3><br />La base de dades de pel·lícules gratuïta més gran, mantinguda per la comunitat. Proporciona metadades i il·lustracions en moltes llengües.<br /><br />Llengües disponibles: diverses.</html>
scraper.imdb.hint=<html><h3>Internet Movie Database (IMDb)</h3><br />La base de dades de pel·lícules més utilitzada arreu del món. No conté l'argument/títol/eslògan en totes les llengües.<br /><br />Llengües disponibles: diverses</html>
scraper.ofdb.hint=<html><h3>Online Filmdatenbank (OFDb)</h3><br />Una base de dades de pel·lícules alemanya impulsada per la comunitat.<br /><br />Llengües disponibles: DE</html>
scraper.zelluloid.hint=<html><h3>Zelluloid.de</h3><br />Una base de dades de pel·lícules alemanya.<br /><br />Llengües disponibles: DE</html>
scraper.moviemeter.hint=<html><h3>Moviemeter.nl</h3><br />Una base de dades de pel·lícules neerlandesa.<br /><br />Llengües disponibles: NL</html>
scraper.rottentomatoes.hint=<html><h3>Rotten Tomatoes</h3><br />Una base de dades de pel·lícules nord-americana.<br />No proporciona l'argument de les pel·lícules antigues a través de l'API.<br /><br />Llengües disponibles: EN</html>
scraper.omdbapi.hint=<html><h3>Omdbapi.com</h3><br />L'API d'OMDb és un servei web RESTful per a obtenir informació de pel·lícules. Tot el contingut i les imatges del lloc són aportats i mantinguts pels usuaris. <br /><br />El tinyMediaManager ofereix un accés limitat a OMDb (10 crides cada 15 segons). Si vols utilitzar OMDb sense aquesta restricció, t'hauries de fer mecenes d'OMDb (https://www.patreon.com/join/omdb).<br /><br />Llengües disponibles: EN</html>
scraper.trakt.hint=<html><h3>Trakt.tv</h3><br />Trakt.tv és una plataforma que fa moltes coses, però principalment fa el seguiment dels programes de televisió i les pel·lícules que mires. També proporciona metadades de pel·lícules i programes de televisió.<br /><br />Llengües disponibles: EN</html>
scraper.universal_movie.hint=<html><h3>Garbellador universal de pel·lícules</h3><br />Un metagarbellador que permet recollir i combinar dades d'altres garbelladors.<br /><br />Perquè aquest garbellador funcioni, cal que indiquis <b>com a mínim</b> quin garbellador s'ha d'utilitzar per a la cerca. Després pots escollir quin garbellador s'utilitzarà per a cada camp de metadades compatible. <b>Cal que configuris individualment tots els garbelladors utilitzats.</b></html>
scraper.universal_tvshow.hint=<html><h3>Garbellador universal de programes de televisió</h3><br />Un metagarbellador que permet recollir i combinar dades d'altres garbelladors.<br /><br />Perquè aquest garbellador funcioni, cal que indiquis <b>com a mínim</b> quin garbellador s'ha d'utilitzar per a la cerca. Després pots escollir quin garbellador s'utilitzarà per a cada camp de metadades compatible. <b>Cal que configuris individualment tots els garbelladors utilitzats.</b></html>
scraper.mpdbtv.hint=<html><h3>MPDb.TV</h3><br />MPDb.TV és un proveïdor de metadades privat per a usuaris francòfons; és possible que n'hagis de ser membre per a utilitzar aquest servei (més informació a http://www.mpdb.tv/)<br /><br />Llengües disponibles: FR</html>
scraper.anidb.hint=<html><h3>aniDB</h3><br />AniDB vol dir Anime DataBase. AniDB és una base de dades d'anime sense ànim de lucre i oberta lliurement al públic.</html>
scraper.tvdb.hint=<html><h3>TheTVDB</h3><br />Una base de dades oberta per als aficionats a la televisió. Aquest garbellador pot garbellar metadades i il·lustracions de sèries de televisió</html>
scraper.animated.hint=<html><h3>Animated Movie Posters</h3><br />tal com es veu a http://forum.kodi.tv/showthread.php?tid=215727 :)</html>
scraper.fanarttv.hint=<html><h3>Fanart.tv</h3><br />Fanart.tv proporciona una enorme biblioteca d'il·lustracions de pel·lícules, programes de televisió i música. Aquest servei es pot utilitzar amb la clau d'API que ofereix el tinyMediaManager, però si vols un accés més ràpid a les il·lustracions, t'hauries de fer VIP de fanart.tv (https://fanart.tv/vip/).</html>
scraper.fanarttv.clientKey=Clau d'API personal
scraper.hd-trailers.hint=<html><h3>hd-trailers.net</h3>Garbellador per a hd-trailers.net que pot garbellar tràilers</html>
scraper.opensubtitles.hint=<html><h3>OpenSubtitles.org</h3><br />Un garbellador de subtítols per a OpenSubtitles.org</html>
scraper.ffmpeg.hint=<html><h3>FFmpeg</h3><br />El proveïdor d'il·lustracions FFmpeg és un metaproveïdor que utilitza la instal·lació local d'FFmpeg per a extreure diversos fotogrames dels arxius de vídeo</html>
