wizard.greeting.text=Aquest auxiliar et guiarà en la configuració bàsica del tinyMediaManager. \n\nProporciona una configuració rudimentària del tinyMediaManager i només tracta les opcions necessàries perquè puguis començar a utilitzar-lo sense conseqüències no desitjades. Un cop acabat, et recomanem que revisis totes les opcions disponibles amb el botó «Opcions» de la barra d'eines principal.
