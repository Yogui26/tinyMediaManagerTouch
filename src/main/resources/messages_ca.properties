Settings.imagecachesize.small=escalar les imatges a una resolució de 400 px pel costat llarg. Útil per a instal·lacions del tinyMediaManager en dispositius amb una resolució de pantalla baixa (com HD/WXGA). Arxius d'imatge més petits.
