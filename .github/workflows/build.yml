name: Build

on:
  push:
    branches: [devel, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Build web UI
        working-directory: src/main/webapp
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp compile

      - name: HTTP API tests
        run: ./mvnw -B -ntp test -DskipTests=false -Dtest='AbstractRestHandlerTest,WebAppHandlerTest,TmmHttpServerTest' -Dsurefire.failIfNoSpecifiedTests=false
